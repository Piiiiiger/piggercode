name: Android app

# Builds the PiggerCode Android APK (arm64-v8a, package dev.piggercode.app), signs it with the release key from the
# repository secrets and smoke-tests it in an emulator. Run it by hand from the Actions tab or the API. With a release
# tag, once the smoke test passed, it uploads the signed APK to that GitHub release (created as a prerelease when it
# does not exist yet) and then the latest.json installed apps update themselves from.
#
# Secrets: ANDROID_KEYSTORE_BASE64 (PKCS12 keystore), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS.
# Optional: ANDROID_GOOGLE_SERVICES_JSON (the owner's Firebase config for this package id). When present it is
# written to apps/ui/google-services.json and wired in by app.config.js; without it the app builds and push stays
# unavailable. The same key must sign every release: Android refuses updates signed with a different one.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release to upload the APK to (empty = only keep it as a workflow artifact)
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_ENV: production
      PIGGERCODE_EMBEDDED_POLICY_ENV: production
      EXPO_UNSTABLE_WEB_MODAL: '1'
      CI: 'true'
      # The shipped APK is arm64 only (a universal one is roughly twice the size). x86_64 is built as well because
      # the emulator of the smoke job cannot run arm64 code; it is stripped from the shipped APK below.
      PIGGERCODE_ANDROID_BUILD_ARCHS: arm64-v8a,x86_64
      PIGGERCODE_ANDROID_GRADLE_JVMARGS: -Xmx4g -XX:MaxMetaspaceSize=1g
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Build shared packages
        run: yarn -s build:packages

      - name: Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > apps/ui/google-services.json
            echo "Firebase config written: push can be enabled"
          else
            echo "No ANDROID_GOOGLE_SERVICES_JSON secret: building without push"
          fi

      - name: Generate the native project
        working-directory: apps/ui
        run: yarn expo prebuild --platform android --no-install --clean

      - name: Build the release APK
        working-directory: apps/ui/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign the APK
        working-directory: apps/ui
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_BASE64" ] || { echo "ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          version=$(node -p "require('./appVariantConfig.cjs').APP_BRAND.version")
          built=$(ls android/app/build/outputs/apk/release/*.apk)
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p "$RUNNER_TEMP/sign" ../../dist/android
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sign/release.p12"
          mkdir -p ../../dist/smoke
          out="../../dist/android/piggercode-${version}-android-arm64.apk"
          smoke_out="../../dist/smoke/piggercode-${version}-android-x86_64.apk"
          sign() { # <abi to drop> <output>
            cp "$built" "$RUNNER_TEMP/sign/drop.apk"
            zip -q -d "$RUNNER_TEMP/sign/drop.apk" "lib/$1/*"
            "$tools/zipalign" -f -p 4 "$RUNNER_TEMP/sign/drop.apk" "$RUNNER_TEMP/sign/aligned.apk"
            "$tools/apksigner" sign --ks "$RUNNER_TEMP/sign/release.p12" --ks-type pkcs12 \
              --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --out "$2" "$RUNNER_TEMP/sign/aligned.apk"
          }
          sign x86_64 "$out"
          sign arm64-v8a "$smoke_out"
          rm -rf "$RUNNER_TEMP/sign"
          "$tools/apksigner" verify --verbose --print-certs "$out" | grep -E "^(Verifies|Verified using|Number of signers|Signer .*certificate SHA-256)"
          "$tools/aapt2" dump badging "$out" | grep -E "^(package|application-label:)"
          ls -l "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: piggercode-android
          path: dist/android/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: piggercode-android-x86_64-smoke
          path: dist/smoke/*.apk
          if-no-files-found: error

  smoke:
    name: smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: piggercode-android-x86_64-smoke
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/android-smoke.sh 'apk/*.apk'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: piggercode-android-smoke
          path: smoke/*
          if-no-files-found: warn

  publish:
    name: publish
    # The release gets a build only once it passed the emulator smoke test: first the APK, then the latest.json
    # installed apps read to update themselves (apps/ui/sources/updates/android/androidApkUpdater.android.ts).
    needs: [build, smoke]
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: piggercode-android
          path: apk

      - name: Upload the APK and latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.release_tag }}"
          repo="${{ github.repository }}"
          if ! gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$repo" --target "${{ github.sha }}" --prerelease \
              --title "PiggerCode Android" --notes "PiggerCode Android APK (arm64-v8a), signed with the PiggerCode release key."
          fi
          apk=$(ls apk/piggercode-*-android-arm64.apk)
          name=$(basename "$apk")
          version=${name#piggercode-}
          version=${version%-android-arm64.apk}
          size=$(stat -c %s "$apk")
          gh release upload "$tag" "$apk" --clobber --repo "$repo"
          url="https://github.com/${repo}/releases/download/${tag}/${name}"
          printf '{"version":"%s","url":"%s","size":%s}\n' "$version" "$url" "$size" > latest.json
          cat latest.json
          gh release upload "$tag" latest.json --clobber --repo "$repo"
