appId: ${PIGGERCODE_E2E_MOBILE_APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true

- runFlow:
    file: _shared/connectDevClientIfNeeded.yaml

- runFlow:
    file: _shared/configureServerIfNeeded.yaml

- runFlow:
    file: _shared/loginCreateAccount.yaml

# The pets feature is on by default (uiFeatureRegistry `pets.companion`); tapping its switch would turn it off.
- openLink: ${PIGGERCODE_E2E_MOBILE_APP_SCHEME}:///settings/pets

- runFlow:
    file: _shared/acceptIosOpenInPromptMaybe.yaml
- runFlow:
    file: _shared/acceptAndroidOpenWithPromptMaybe.yaml

- assertVisible:
    id: settings-pets-enabled
- assertNotVisible:
    id: settings-pets-desktop-overlay-enabled
- assertNotVisible:
    id: settings-pets-desktop-overlay-device-override
- assertNotVisible:
    id: settings-pets-desktop-overlay-reset-position

- tapOn:
    id: settings-pets-enabled
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 1000

# PiggerCode ships no built-in pets. With pets on and no pet taken from a daemon, this device shows none, and its
# group in Settings says so (a daemon-served pet is covered by the web specs).
- scrollUntilVisible:
    element:
      id: settings-pets-local-library-empty
    direction: DOWN

- assertNotVisible:
    id: pet-app-shell-companion-root
