apiVersion: v1
kind: ConfigMap
metadata:
  name: happier-server-config
data:
  NODE_ENV: production
  PORT: "3005"
  PIGGERCODE_SERVER_FLAVOR: full
  PIGGERCODE_DB_PROVIDER: postgres
  PIGGERCODE_FILES_BACKEND: s3
  PIGGERCODE_SOCKET_ADAPTER: memory
  SERVER_ROLE: all
  RUN_MIGRATIONS: "0"
  PIGGERCODE_PUBLIC_SERVER_URL: https://happier.example.com
  PIGGERCODE_WEBAPP_URL: https://happier.example.com
  METRICS_ENABLED: "true"
  METRICS_PORT: "9090"
